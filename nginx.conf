# =============================================================================
# Nginx config for SmartFirePredict frontend container
# =============================================================================
# The frontend container serves HTML/CSS/JS.
# All /api/* and /video /thermal /status calls are proxied to the backend
# container (named "backend" in docker-compose).
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets ─────────────────────────────────────────────────────────
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        gzip_static on;
    }

    # ── Proxy API calls to the FastAPI backend ────────────────────────────────
    # The JS frontend calls window.location.origin + "/status", "/video" etc.
    # In a two-container setup, we rewrite these to the backend service.
    location ~ ^/(status|video|thermal|detections|location|set-stream|use-webcam|stop-stream|camera|twilio|settings|docs|openapi) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for MJPEG streaming (video/thermal feeds)
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ── Proxy WebSockets to the FastAPI backend ───────────────────────────────
    location /ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Serve SPA index for all other routes ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
